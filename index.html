<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="芊芊影音">
  <meta name="theme-color" content="#0a1a3f">
  <title>影音上傳分享區</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a1a3f; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    .fallback { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); text-align: center; font: 14px/1.4 -apple-system, "Noto Sans TC", sans-serif; pointer-events: none; }
    .fallback a { pointer-events: auto; color: rgba(255,255,255,.6); }
  </style>
</head>
<body>
  <!-- allow：讓頁面裡的相機、麥克風、全螢幕、分享、複製、螢幕常亮，在嵌入狀態下也能使用 -->
  <iframe
    id="app"
    title="芊芊影音上傳分享區"
    allow="camera; microphone; fullscreen; clipboard-write; web-share; autoplay; screen-wake-lock"
    referrerpolicy="no-referrer"></iframe>
  
  <script>
    // Apps Script 的 exec 網址（重新部署時用「管理部署作業 → 編輯 → 新版本」，網址就不會變）
    var EXEC = 'https://script.google.com/macros/s/AKfycbxtPfQy2KG4ZBazK9Hw2R1AUIgKnpyuXNMXM386AlZt3jrIJJLVx_fkallEFGcuu-YQFw/exec';

    // 把網址後面的 ?t=團代碼（或 ?admin=1）原封不動轉給 Apps Script
    var url = EXEC + (location.search || '');
    document.getElementById('app').src = url;
    
    /* ===== 上傳時讓螢幕保持亮著 =====
       上傳頁開始上傳時會通知這裡，這一層是最外層，手機才肯讓它鎖住螢幕不熄 */
    var wakeLock = null;
    var wantAwake = false;

    function lockScreen() {
      if (!wantAwake || wakeLock || !('wakeLock' in navigator)) return;
      navigator.wakeLock.request('screen').then(function (lock) {
        wakeLock = lock;
        lock.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () { wakeLock = null; });
    }

    function unlockScreen() {
      wantAwake = false;
      try { if (wakeLock) wakeLock.release(); } catch (e) {}
      wakeLock = null;
    }

    window.addEventListener('message', function (e) {
      var host = '';
      try { host = new URL(e.origin).hostname; } catch (err) { return; }
      if (!/(\.googleusercontent\.com|script\.google\.com)$/.test(host)) return;
      if (!e.data || typeof e.data.qqAwake !== 'boolean') return;
      if (e.data.qqAwake) { wantAwake = true; lockScreen(); }
      else unlockScreen();
    });

    // 切回來時，如果還在上傳就重新鎖住
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') lockScreen();
    });
  </script>
</body>
</html>
