<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>挑選相本照片</title>
<style>
  html,body{margin:0;height:100%;background:#050f33}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="app" allow="clipboard-write" title="挑選相本照片"></iframe>
<script>
  // ===== 只要改這一行：貼上 Apps Script 的部署網址（結尾是 /exec） =====
  const EXEC_URL = 'https://script.google.com/macros/s/AKfycbw_7fSjDRzkneZ8lNj1DtHiU4W6o_e1cFayxSWtvQjwkcP9PGqZbstLIsmDKBwfkVQMbw/exec';
  // ======================================================================

  // 把網址後面的 ?folder=... 或 ?admin=... 原樣帶給 Apps Script
  document.getElementById('app').src = EXEC_URL + location.search;
</script>
</body>
</html>
